// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

// Google Drive can add desktop.ini files between Android build tasks.
tasks.configureEach {
    doFirst {
        fileTree(rootDir).matching { include '**/desktop.ini' }.files.each { f ->
            if (f.exists()) f.delete()
        }
    }
    doLast {
        fileTree(rootDir).matching { include '**/desktop.ini' }.files.each { f ->
            if (f.exists()) f.delete()
        }
    }
}

gradle.projectsEvaluated {
    project(':app').tasks.named('packageRelease') {
        doFirst {
            delete file("$rootDir/app/build/intermediates/incremental/packageRelease/tmp")
        }
    }
}
